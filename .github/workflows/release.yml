name: Release Obsidian plugin

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must match manifest.json). The tag is created on the selected branch.
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release version
        run: |
          node -e "const m=require('./manifest.json'); const p=require('./package.json'); if (m.version !== p.version || m.version !== process.env.RELEASE_VERSION) process.exit(1)"
      - run: npm ci
      - run: npm run check
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_VERSION" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_VERSION" \
            --notes "More software, tools, and ideas: [gabrielbacha.com](https://www.gabrielbacha.com/?utm_source=github&utm_medium=referral&utm_campaign=obsidian_assets&utm_content=folder_toolkit_release)" \
            --generate-notes \
            main.js manifest.json styles.css
